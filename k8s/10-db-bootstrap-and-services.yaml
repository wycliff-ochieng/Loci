apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: loci
data:
  01-init.sql: |
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
---
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: loci
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: loci
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432