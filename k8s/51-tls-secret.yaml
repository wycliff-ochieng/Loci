# TLS Secret for HTTPS termination at the nginx reverse-proxy.
#
# This file is an OPERATIONAL GUIDE, not a manifest to be applied directly.
# The placeholder values below are not valid base64 and kubectl will reject them.
#
# Before deploying, create the secret from real certificate files:
#
#   kubectl create secret tls loci-tls \
#     --cert=/path/to/fullchain.pem \
#     --key=/path/to/privkey.pem    \
#     -n loci
#
# Verify the secret was created:
#   kubectl get secret loci-tls -n loci
#
# Certificate notes:
#   - tls.crt must contain the full chain (leaf certificate + intermediates).
#   - tls.key must be the private key matching the leaf certificate.
#   - Do NOT commit real certificate material to source control.
#   - For production, obtain a certificate from a trusted CA (e.g. Let's Encrypt).
#     If running on a bare IP (89.117.52.219), Let's Encrypt won't issue a cert;
#     use a self-signed cert or move to a DNS-based domain.
#
# Why HTTPS is required:
#   Modern browsers only allow the Geolocation API (navigator.geolocation) in a
#   secure context (HTTPS or localhost).  Serving the app over plain HTTP causes
#   the browser to block geolocation access; the frontend falls back to inaccurate
#   default coordinates, making every dropped message appear at the wrong location.
#
# Reference manifest (do NOT kubectl apply this directly):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: loci-tls
#   namespace: loci
# type: kubernetes.io/tls
# data:
#   tls.crt: <BASE64_ENCODED_FULLCHAIN_PEM>   # cat fullchain.pem | base64 -w 0
#   tls.key: <BASE64_ENCODED_PRIVKEY_PEM>     # cat privkey.pem   | base64 -w 0
